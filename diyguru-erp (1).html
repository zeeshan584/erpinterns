<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DIYguru ERP — Intern Daily Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#1b2523;--green:#8fd299;--glight:#d4f0dc;--gdeep:#3d8b52;
  --muted:#5a7068;--bg:#f4faf6;--card:#fff;--border:#c8e8d0;
  --red:#e74c3c;--amber:#f39c12;--blue:#2980b9;--purple:#8e44ad;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--dark)}
.hidden{display:none!important}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#1b2523 0%,#2d4a3e 55%,#3a6b52 100%);padding:1rem}
.login-box{background:#fff;border-radius:22px;padding:2rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:1.8rem}
.brand-mark{width:46px;height:46px;background:var(--dark);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark span{color:var(--green);font-weight:900;font-size:16px}
.brand h1{font-size:18px;font-weight:800;color:var(--dark)}
.brand p{font-size:11px;color:var(--muted)}
.login-title{font-size:24px;font-weight:800;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.user-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.user-card{padding:14px 10px;border-radius:14px;border:2px solid var(--border);background:var(--bg);
  text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.user-card:hover{border-color:var(--gdeep);background:var(--glight)}
.user-card.selected{border-color:var(--gdeep);background:var(--dark)}
.uc-avatar{width:40px;height:40px;border-radius:50%;background:var(--glight);margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--gdeep)}
.user-card.selected .uc-avatar{background:var(--gdeep);color:#fff}
.uc-name{font-size:13px;font-weight:700;color:var(--dark)}
.uc-role{font-size:10px;color:var(--muted);margin-top:2px}
.user-card.selected .uc-name,.user-card.selected .uc-role{color:#fff}
.user-card.selected .uc-role{color:var(--green)}
.pin-section{display:none}
.pin-section.show{display:block}
.pin-who{font-size:13px;color:var(--muted);margin-bottom:10px}
.pin-dots{display:flex;gap:10px;margin-bottom:12px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:#fff;transition:all .15s}
.pin-dot.filled{background:var(--dark);border-color:var(--dark)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pin-key{padding:14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;
  font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:all .1s;user-select:none}
.pin-key:hover{background:var(--glight);border-color:var(--gdeep)}
.pin-key:active{transform:scale(.93)}
.pin-err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}

/* ── TOPBAR ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--dark);padding:0 1.2rem;height:56px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;gap:8px}
.tb-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tb-logo{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:13px;color:var(--dark);flex-shrink:0}
.tb-name{color:#fff;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-role{color:var(--green);font-size:10px;font-weight:600;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-date{color:rgba(255,255,255,.5);font-size:11px}
.btn-sm{padding:6px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-clock-in{background:var(--green);color:var(--dark)}
.btn-clock-out{background:var(--red);color:#fff}
.btn-logout{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)!important}

/* ── SIDEBAR + LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:200px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:1rem 0}
.nav-section{padding:0 .8rem;margin-bottom:1.2rem}
.nav-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  padding:0 .6rem;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--bg);color:var(--dark)}
.nav-item.active{background:var(--glight);color:var(--gdeep);font-weight:700}
.nav-icon{font-size:15px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--dark);color:var(--green);font-size:9px;
  font-weight:800;padding:2px 6px;border-radius:10px}
.page{flex:1;overflow-y:auto;padding:1.4rem}

/* ── BUTTONS ── */
.btn-primary{padding:10px 22px;background:var(--dark);color:var(--green);border:none;
  border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{padding:10px 16px;background:#fff;color:var(--muted);border:1.5px solid var(--border);
  border-radius:10px;font-size:13px;cursor:pointer}
.btn-excel{padding:9px 16px;background:#1d6f42;color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}
.btn-add-row{padding:7px 14px;background:var(--glight);color:var(--gdeep);border:1.5px dashed var(--gdeep);
  border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:10px}
.btn-add-row:hover{background:var(--gdeep);color:#fff}
.btn-remove{width:24px;height:24px;border-radius:50%;background:#fde8e8;color:var(--red);border:none;
  cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:1.5rem}
.kpi{background:#fff;border-radius:14px;padding:1.1rem;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-color,var(--gdeep))}
.kpi.dark{background:var(--dark);border-color:var(--dark)}
.kpi.dark::before{background:var(--green)}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.kpi.dark .kpi-lbl{color:var(--green)}
.kpi-val{font-size:26px;font-weight:900;color:var(--dark);line-height:1}
.kpi.dark .kpi-val{color:#fff}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px}
.kpi.dark .kpi-sub{color:#8fd29980}
.kpi-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.12}
.prog{height:4px;background:var(--glight);border-radius:2px;margin-top:10px;overflow:hidden}
.prog-fill{height:100%;background:var(--gdeep);border-radius:2px;transition:width .6s}

/* ── PAGE SECTIONS ── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:800;color:var(--dark)}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px}
.section-card{background:#fff;border-radius:16px;border:1px solid var(--border);padding:1.4rem;margin-bottom:1.2rem}
.section-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:1rem;padding-bottom:8px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff{display:flex;flex-direction:column;gap:5px}
.ff.full{grid-column:span 2}
.ff.third{grid-column:span 1}
.ff label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.ff input,.ff select,.ff textarea{padding:9px 11px;border:1.5px solid var(--border);
  border-radius:9px;font-size:13px;color:var(--dark);outline:none;background:#fff;transition:border .15s;font-family:inherit}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--gdeep)}
.ff input[type=number]{-moz-appearance:textfield}
.ff input[type=number]::-webkit-inner-spin-button{opacity:0}

/* ── PROSPECT ROWS ── */
.prospect-row{display:grid;grid-template-columns:2fr 2fr 1.5fr 1.5fr 1.5fr auto;gap:8px;align-items:center;
  padding:10px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.pr-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
.pr-input{padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;
  color:var(--dark);outline:none;background:#fff;width:100%;font-family:inherit}
.pr-input:focus{border-color:var(--gdeep)}

/* ── TABLE ── */
.tbl-wrap{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
.data-table thead th{background:var(--dark);color:var(--green);padding:10px 12px;text-align:left;
  font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border:none}
.data-table tbody tr:hover td{background:#f9fdf9}
.empty-row{padding:2.5rem;text-align:center;color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.pill.hot{background:#fde8e8;color:var(--red)}
.pill.warm{background:#fff3e0;color:#c67200}
.pill.cold{background:#e8f4fd;color:var(--blue)}
.pill.enrolled{background:var(--glight);color:var(--gdeep)}
.pill.followup{background:#f3e8fd;color:var(--purple)}

/* ── TOAST ── */
.toast{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;animation:slideIn .2s}
.toast.ok{background:var(--glight);border:1px solid var(--green);color:var(--gdeep)}
.toast.error{background:#fde8e8;border:1px solid var(--red);color:var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── STAT ROW ── */
.stat-row{display:flex;gap:12px;margin-bottom:1.2rem;flex-wrap:wrap}
.stat-chip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;font-size:12px}
.stat-chip strong{font-size:16px;font-weight:800;color:var(--dark)}
.stat-chip span{color:var(--muted)}

/* ── DATE FILTER ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-bar input,.filter-bar select{padding:7px 11px;border:1.5px solid var(--border);border-radius:8px;
  font-size:12px;color:var(--dark);outline:none;background:#fff;font-family:inherit}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--gdeep)}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .sidebar{display:none}
  .form-grid{grid-template-columns:1fr}
  .ff.full{grid-column:span 1}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .prospect-row{grid-template-columns:1fr 1fr;gap:6px}
  .page{padding:1rem}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark"><span>DG</span></div>
      <div>
        <h1>DIYguru ERP</h1>
        <p>Intern Daily Performance Tracker</p>
      </div>
    </div>
    <div class="login-title">Good day! 👋</div>
    <div class="login-sub">Select your name, then enter your PIN</div>
    <div class="user-cards" id="user-cards"></div>
    <div class="pin-section" id="pin-section">
      <div class="pin-who" id="pin-who">Enter PIN</div>
      <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
      </div>
      <div class="pin-err" id="pin-err"></div>
      <div class="pin-pad">
        <div class="pin-key" onclick="pp('1')">1</div><div class="pin-key" onclick="pp('2')">2</div><div class="pin-key" onclick="pp('3')">3</div>
        <div class="pin-key" onclick="pp('4')">4</div><div class="pin-key" onclick="pp('5')">5</div><div class="pin-key" onclick="pp('6')">6</div>
        <div class="pin-key" onclick="pp('7')">7</div><div class="pin-key" onclick="pp('8')">8</div><div class="pin-key" onclick="pp('9')">9</div>
        <div class="pin-key" onclick="pclr()">⌫</div><div class="pin-key" onclick="pp('0')">0</div><div class="pin-key" onclick="prst()" style="font-size:11px;color:#aaa">CLR</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-logo">DG</div>
      <div>
        <div class="tb-name" id="tb-name">—</div>
        <div class="tb-role" id="tb-role">—</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="tb-date" id="tb-date"></div>
      <button class="btn-sm btn-clock-in" id="clock-btn" onclick="toggleClock()">Clock In</button>
      <button class="btn-sm btn-logout" onclick="doLogout()">Exit</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="nav-section">
        <div class="nav-label">Overview</div>
        <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Daily Work</div>
        <div class="nav-item" onclick="nav('daily')" id="nav-daily">
          <span class="nav-icon">📋</span> Daily Report
        </div>
        <div class="nav-item" onclick="nav('admissions')" id="nav-admissions">
          <span class="nav-icon">🎓</span> Admissions
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Records</div>
        <div class="nav-item" onclick="nav('history')" id="nav-history">
          <span class="nav-icon">📁</span> All Reports
          <span class="nav-badge" id="badge-count">0</span>
        </div>
        <div class="nav-item" onclick="nav('attendance')" id="nav-attendance">
          <span class="nav-icon">🕐</span> Attendance
        </div>
      </div>
    </div>
    <div class="page" id="page-content"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   CONFIG — Paste your Google Apps Script URL here
   ════════════════════════════════════════════════ */
const SHEETS_URL = ""; // e.g. "https://script.google.com/macros/s/YOUR_ID/exec"

/* ── USERS ── */
const USERS = [
  {id:1, name:"Aditi Devghaore",  role:"BDA Pre-Sale",   pin:"1111"},
  {id:2, name:"Rugveda Pawar",    role:"BD Executive",   pin:"1111"},
  {id:3, name:"Intern — Sales 1", role:"Sales Intern",   pin:"1111"},
  {id:4, name:"Intern — Sales 2", role:"Sales Intern",   pin:"1111"},
];

const COURSES = ["EV Internship (3-Week)","PG Certificate – EV (12M)","Battery Technology","EV Design & Manufacturing","BMS & Power Electronics","E-Mobility Management","Automotive AI/ADAS"];
const STAGES  = ["Hot Lead","Warm Lead","Cold Lead","Follow-up","Enrolled","Not Interested"];
const SOURCES = ["Instagram","YouTube","WhatsApp","College Campus","Referral","LinkedIn","Google Ads","Walk-in","Other"];

/* ── STATE ── */
let S = {
  user:null, page:"dashboard", pinBuf:"", selUser:null,
  clockedIn:false, clockIn:null,
  reports:[], admissions:[], attendance:[],
  toast:null,
  dForm: emptyDForm(),
  aForm: emptyAForm(),
};

function emptyDForm(){
  return {
    date: todayISO(), totalCalls:0, followUps:0, demosDone:0,
    emailsSent:0, whatsappSent:0, notes:"",
    prospects:[ emptyProspect() ]
  };
}
function emptyAForm(){
  return {name:"",phone:"",email:"",course:"",amount:"",payment:"Full Payment",source:"",notes:"",status:"Enrolled"};
}
function emptyProspect(){
  return {name:"",phone:"",course:"",stage:"Warm Lead",ticketSize:"",goal:"",callStatus:"Called"};
}

/* ── PERSISTENCE ── */
function save(){
  localStorage.setItem("dg_reports",JSON.stringify(S.reports));
  localStorage.setItem("dg_admissions",JSON.stringify(S.admissions));
  localStorage.setItem("dg_attendance",JSON.stringify(S.attendance));
}
function load(){
  try{
    S.reports   = JSON.parse(localStorage.getItem("dg_reports")||"[]");
    S.admissions= JSON.parse(localStorage.getItem("dg_admissions")||"[]");
    S.attendance= JSON.parse(localStorage.getItem("dg_attendance")||"[]");
  }catch(e){}
}

/* ── HELPERS ── */
function pad(n){return String(n).padStart(2,"0")}
function fmtT(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function fmtD(d){return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function fmtS(d){return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})}
function todayISO(){return new Date().toISOString().slice(0,10)}
function todayStr(){return new Date().toDateString()}
function ini(n){return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}
function thisMonth(arr){const n=new Date();return arr.filter(r=>{const d=new Date(r.date||r.ts);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()})}
function toToday(arr){return arr.filter(r=>new Date(r.date||r.ts).toDateString()===todayStr())}
function sumField(arr,f){return arr.reduce((s,r)=>s+(parseInt(r[f])||0),0)}
function stageClass(s){
  if(s==="Hot Lead") return "hot";
  if(s==="Enrolled") return "enrolled";
  if(s==="Follow-up") return "followup";
  if(s==="Cold Lead"||s==="Not Interested") return "cold";
  return "warm";
}

/* ── BUILD LOGIN ── */
function buildLogin(){
  document.getElementById("user-cards").innerHTML = USERS.map(u=>`
    <div class="user-card" id="uc-${u.id}" onclick="selUser(${u.id})">
      <div class="uc-avatar">${ini(u.name)}</div>
      <div class="uc-name">${u.name.split(" ")[0]}</div>
      <div class="uc-role">${u.role}</div>
    </div>`).join("");
}
function selUser(id){
  S.selUser=USERS.find(u=>u.id===id);
  document.querySelectorAll(".user-card").forEach(c=>c.classList.remove("selected"));
  document.getElementById("uc-"+id).classList.add("selected");
  document.getElementById("pin-section").classList.add("show");
  document.getElementById("pin-who").textContent=`PIN for ${S.selUser.name.split(" ")[0]}`;
  prst();
}
function pp(d){if(!S.selUser||S.pinBuf.length>=4) return; S.pinBuf+=d; updDots(); if(S.pinBuf.length===4) setTimeout(checkPin,120);}
function pclr(){S.pinBuf=S.pinBuf.slice(0,-1); updDots();}
function prst(){S.pinBuf=""; updDots(); document.getElementById("pin-err").textContent="";}
function updDots(){for(let i=0;i<4;i++) document.getElementById("pd"+i).className="pin-dot"+(i<S.pinBuf.length?" filled":"");}
function checkPin(){
  if(S.pinBuf===S.selUser.pin){
    S.user=S.selUser;
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("tb-name").textContent=S.user.name;
    document.getElementById("tb-role").textContent=S.user.role;
    document.getElementById("tb-date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short"});
    document.getElementById("badge-count").textContent=S.reports.length;
    S.dForm=emptyDForm();
    nav("dashboard");
  } else {
    document.getElementById("pin-err").textContent="Wrong PIN — try 1111";
    prst();
  }
}

/* ── CLOCK ── */
let clockInt;
function toggleClock(){
  const btn=document.getElementById("clock-btn");
  if(!S.clockedIn){
    S.clockedIn=true; S.clockIn=new Date();
    S.attendance.push({user:S.user.name,role:S.user.role,date:new Date(),in:new Date(),out:null});
    btn.textContent="Clock Out"; btn.className="btn-sm btn-clock-out";
    save();
  } else {
    S.clockedIn=false;
    const r=S.attendance[S.attendance.length-1];
    if(r&&!r.out) r.out=new Date();
    S.clockIn=null; btn.textContent="Clock In"; btn.className="btn-sm btn-clock-in";
    save();
  }
}
function doLogout(){
  if(S.clockedIn) toggleClock();
  S.user=null; S.selUser=null; S.pinBuf=""; S.clockedIn=false;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");

  prst();
}

async function submitDaily(){

  const entry={

    totalCalls:parseInt(f.totalCalls)||0,

    demosDone:parseInt(f.demosDone)||0,
    emailsSent:parseInt(f.emailsSent)||0,
    whatsappSent:parseInt(f.whatsappSent)||0,
    callsPickup:parseInt(f.callsPickup)||0,
    notes:f.notes,
    prospects:f.prospects.filter(p=>p.name||p.course)
  };
  S.reports.push(entry);
  save();
  document.getElementById("badge-count").textContent=S.reports.length;
  S.dForm=emptyDForm();
  S.toast={type:"ok",msg:"✓ Daily report saved! "+(SHEETS_URL?"Syncing to Google Sheets...":"Stored locally.")};

  setTimeout(()=>nav("dashboard"),2500);
}

      "#":i+1,"Date":r.date,"Submitted By":r.by,"Role":r.byRole,
      "Total Calls":r.totalCalls,"Follow-ups":r.followUps,"Demos":r.demosDone,
      "Emails Sent":r.emailsSent,"WhatsApp":r.whatsappSent,"Calls Pickup":r.callsPickup||0,
      "Prospects Count":(r.prospects||[]).length,
      "Hot Leads":(r.prospects||[]).filter(p=>p.stage==="Hot Lead").length,
      "Notes":r.notes||""
    };
    dailyRows.push(base);
  });
  const ws1=XLSX.utils.json_to_sheet(dailyRows.length?dailyRows:[{"Message":"No reports yet"}]);
  ws1["!cols"]=[4,12,18,14,12,10,10,12,10,10,14,10,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,"Interns Daily Report");

  /* Sheet 2: Prospects */
  const prospRows=[];
  S.reports.forEach(r=>(r.prospects||[]).filter(p=>p.name||p.course).forEach(p=>{
    prospRows.push({"Date":r.date,"Intern":r.by,"Prospect Name":p.name,"Phone":p.phone||"",
      "Course":p.course,"Stage":p.stage,"Ticket Size (₹)":p.ticketSize||"",
      "Call Status":p.callStatus,"Goal":p.goal||""});
  }));
  const ws2=XLSX.utils.json_to_sheet(prospRows.length?prospRows:[{"Message":"No prospects yet"}]);
  ws2["!cols"]=[12,16,18,14,25,14,14,14,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws2,"Prospects Log");

  /* Sheet 3: Admissions */
  const admRows=S.admissions.map((a,i)=>({
    "#":i+1,"Date":a.date,"Name":a.name,"Phone":a.phone,"Email":a.email||"",
    "Course":a.course,"Amount (₹)":parseInt(a.amount)||0,"Payment":a.payment,
    "Source":a.source||"","Status":a.status,"Notes":a.notes||"","By":a.by
  }));
  const ws3=XLSX.utils.json_to_sheet(admRows.length?admRows:[{"Message":"No admissions yet"}]);
  XLSX.utils.book_append_sheet(wb,ws3,"Admissions");

  /* Sheet 4: Attendance */
  const attRows=S.attendance.map((a,i)=>({
    "#":i+1,"Name":a.user,"Role":a.role||"","Date":new Date(a.date).toLocaleDateString("en-IN"),
    "Clock In":fmtT(new Date(a.in)),"Clock Out":a.out?fmtT(new Date(a.out)):"—",
    "Hours":a.out?((new Date(a.out)-new Date(a.in))/3600000).toFixed(1):"—"
  }));
  const ws4=XLSX.utils.json_to_sheet(attRows.length?attRows:[{"Message":"No attendance yet"}]);
  XLSX.utils.book_append_sheet(wb,ws4,"Attendance");

  XLSX.writeFile(wb,`DIYguru_ERP_${todayISO()}.xlsx`);
}

async function syncSheets(data){
  if(!SHEETS_URL) return;
  try{
    await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  }catch(e){console.warn("Sheets sync:",e)}
}

function bindAll(){
  const ids=[
    ["f-date","date"],["f-totalCalls","totalCalls"],["f-followUps","followUps"],
    ["f-demosDone","demosDone"],["f-emailsSent","emailsSent"],["f-whatsappSent","whatsappSent"],
    ["f-callsPickup","callsPickup"],["f-notes","notes"]
  ];
  ids.forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el) el.oninput=el.onchange=()=>S.dForm[key]=el.value;
  });
  const aIds=[["a-name","name"],["a-phone","phone"],["a-email","email"],["a-course","course"],
    ["a-amount","amount"],["a-payment","payment"],["a-source","source"],["a-status","status"],["a-notes","notes"]];
  aIds.forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el) el.oninput=el.onchange=()=>S.aForm[key]=el.value;
  });
}
